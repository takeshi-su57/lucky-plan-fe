type Query {
  allLogs(after: Int, checked: Boolean!, first: Int!, severity: LogSeverity): LogsConnection!
  findContract(id: Int!): Contract!
  findStrategy(id: Int!): Strategy
  getALLSLTPs: [SLTPRequest!]!
  getActiveBots: [BotForwardDetails!]!
  getAdaptionStatus: String!
  getAlertTasks: [TaskBackwardDetails!]!
  getAllContracts: [Contract!]!
  getAllFollowerDetails(after: Int, contractId: Int!, first: Int!): FollowerConnection!
  getAllFollowers: [Follower!]!
  getAllStrategy: [Strategy!]!
  getAllUsers: [User!]!
  getBotsByStatus(after: Int, first: Int!, status: BotStatus!): BotConnection!
  getGnsPrices(fromDate: Date!, pairName: String!, toDate: Date!): [GnsPricingRecord!]!
  getLogsSeverityCounts: [SeverityCount!]!
  getMaxOpenMissions: Int!
  getMicroserviceStatus: [MicroserviceStatus!]!
  getPerpTradeHistories(addresses: [String!]!, platform: Platform!): [[PerpTradeHistory!]!]!
  getPlanBotGroups(hideDead: Boolean! = true, page: Int! = 1, pageSize: Int! = 10, planId: Int!): BotGroupPaginatedResponse!
  getPlanById(id: Int!): Plan
  getPlanSummariesByStatus(after: Int, first: Int!, status: PlanStatus!): PlanSummaryConnection!
  getPlansByStatus(after: Int, first: Int!, status: PlanStatus!): PlanConnection!
  getPnlSnapshotV2InitializedFlag(platform: Platform!): [PnlSnapshotV2InitializedFlag!]!
  getPnlSnapshotsV2(after: String, dateStr: String!, first: Int!, isDesc: Boolean!, platform: Platform!): PnlSnapshotV2DetailsConnection!
  getServerTime: ServerTime!
  isPnlSnapshotV2Initialized(dateStr: String!, platform: Platform!): PnlSnapshotV2InitializedFlag
  isSafeApp: Boolean!
  systemStatus: Boolean!
}

