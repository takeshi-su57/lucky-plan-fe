type Mutation {
  allowAuto(address: String!, allowAuto: Boolean!, budget: Float!, followerContractId: Int!, ratio: Float!): User!
  batchCreateBots(input: [CreateBotAndStrategyInput!]!): [BotBackwardDetails!]!
  buildPnlSnapshotsV2(dateStr: String!, isForceBuild: Boolean!, platform: Platform!): Boolean!
  cancelOrderAfterTimeout(input: CancelOrderAfterTimeoutInput!): ContractExecutionResult!
  changePassword(newPassword: String!, oldPassword: String!): Boolean!
  changeUserPermission(address: String!, permission: String!): User!
  checkLog(id: Int!): Log!
  cleanDB: Boolean!
  cloneMission(id: Int!, manualParams: ManualParams): Boolean!
  closeMission(id: Int!, isForce: Boolean!): Boolean!
  closeTradeMarket(input: CloseTradeInput!): ContractExecutionResult!
  createBot(input: CreateBotInput!): BotBackwardDetails!
  createPlan(createPlanInput: CreatePlanInput!): Plan!
  createSLTP(input: SLTPRequestInput!): SLTPRequest!
  decreaseAllowanceToZero(collateralIndex: Int!, contractId: Int!, followerAddress: String!, password: String!): Boolean!
  decreasePositionSize(input: DecreasePositionSizeInput!): ContractExecutionResult!
  deleteBot(id: Int!): BotBackwardDetails!
  deletePlan(id: Int!): Int!
  deleteSLTP(id: Int!): SLTPRequest!
  depositAsset(input: AssetInput!): Boolean!
  disableContract(contractId: Int!): Contract!
  dynamicSnapshotBuildV2(dateStr: String!, platform: Platform!): Boolean!
  endPlan(id: Int!): Boolean!
  generateNewFollower: Follower!
  getToken(signature: String!, timestamp: String!, walletAddress: String!): AccessToken!
  ignoreMission(id: Int!): Boolean!
  increaseAllowanceToMax(collateralIndex: Int!, contractId: Int!, followerAddress: String!, password: String!): Boolean!
  increasePositionSize(input: IncreasePositionSizeInput!): ContractExecutionResult!
  initializePnlSnapshotV2(beginingDate: Date!, isForceBuild: Boolean!, platform: Platform!): Boolean!
  killSubService(service: String!): Boolean!
  liveBot(id: Int!): Boolean!
  liveContract(contractId: Int!, fromBlock: Int): Contract!
  makeSafeApp(password: String!): Boolean!
  openTradeMarket(input: OpenTradeInput!): ContractExecutionResult!
  pauseSystem: Boolean!
  performTask(id: Int!): Boolean!
  resumeSystem(password: String): Boolean!
  startAdaption(contractId: Int!, shouldRestart: Boolean!): Boolean!
  startPlan(id: Int!): Boolean!
  startSubService(service: String!): Boolean!
  stopBot(id: Int!): Boolean!
  stopTask(id: Int!): Boolean!
  updateLeverage(input: UpdateLeverageInput!): ContractExecutionResult!
  updateMaxOpenMissions(maxCount: Int!): Boolean!
  updatePlan(updatePlanInput: UpdatePlanInput!): Plan!
  updateSl(input: UpdateSlInput!): ContractExecutionResult!
  updateStrategy(id: Int!, input: UpdateStrategyInput!): Strategy!
  updateTp(input: UpdateTpInput!): ContractExecutionResult!
  withdrawAllETH(input: WithdrawAllInput!): Boolean!
  withdrawAllErc20(input: WithdrawAllInput!): Boolean!
  withdrawAsset(input: AssetInput!): Boolean!
  withdrawETHToUser(amount: Float!, contractId: Int!, password: String!): Boolean!
  withdrawErc20ToUser(amount: Float!, collateralIndex: Int!, contractId: Int!, password: String!): Boolean!
  withdrawPositivePnl(input: WithdrawPositivePnlInput!): ContractExecutionResult!
}

